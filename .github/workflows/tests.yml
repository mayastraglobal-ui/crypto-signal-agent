name: Tests

# Runs the automatic tests on every push and pull request.
# Green tick = all tests passed. Red cross = something is broken; open the run to see which test.
on:
  push:
    paths-ignore:
      - "reports/**"          # the hourly / daily report commits don't need testing
      - "memory/**"           # ... nor the engine's memory logs (a pull request still runs every test)
  pull_request:
  workflow_dispatch:

permissions:
  actions: read              # notify.py reads the previous test runs (ALERT at the first red run on main, FIXED after)
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 on 19 Oct 2026
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run tests (offline, synthetic data - no internet or secrets needed; test files in parallel)
        run: python tests/run_all.py

      - name: Email "fixed" once when the tests on main are green again
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python notify.py recovered tests

      - name: Email an ALERT when the tests on main turn red (once, at the first red run)
        if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python notify.py tests_failed
