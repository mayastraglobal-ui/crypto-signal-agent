name: Crypto Signal Scan

on:
  schedule:
    - cron: "7 * * * *"     # every hour at minute 7 (UTC). GitHub may start it a few minutes late.
  workflow_dispatch:         # lets you press "Run workflow" by hand
    inputs:
      test_email:
        description: "Send a test email"
        type: boolean
        default: false

permissions:
  contents: write            # needed to save the reports back into the repo

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 on 19 Oct 2026
    timeout-minutes: 30
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      ALERT_TO: ${{ secrets.ALERT_TO }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Test email
        if: ${{ inputs.test_email }}
        run: python notify.py test

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore the daily research results (branch live-reports)
        run: python publish_live.py --restore

      - name: Scan, backtest, find signals
        env:
          GITHUB_TOKEN: ${{ github.token }}   # only to read the repository size for the report
        run: python scanner.py

      - name: Email new signals and position updates ([ENTRY] / [EXIT])
        continue-on-error: true
        run: python notify.py

      - name: Daily report email (first scan after 00:00 UTC = 08:00 Beijing)
        continue-on-error: true
        run: python notify.py daily

      - name: Weekly report email (Sunday, first scan from 04:00 UTC = 12:00 Beijing)
        continue-on-error: true
        run: python notify.py weekly

      - name: Email data-quality alerts
        continue-on-error: true
        run: python notify.py system

      - name: Memory guard (append-only files may only grow - section 17)
        run: python memory_guard.py

      - name: Save reports
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add reports memory
          git commit -m "Scan $(date -u +'%Y-%m-%d %H:%M') UTC" || echo "Nothing new"
          git pull --rebase --autostash || true
          git push

      - name: Publish the large report files (branch live-reports, one commit, no history)
        run: python publish_live.py

      - name: Dashboard (GitHub Pages, branch gh-pages - never stops the run)
        continue-on-error: true
        run: python build_dashboard.py --publish

      - name: Email if the scan failed
        if: ${{ failure() }}
        run: python3 notify.py failed
