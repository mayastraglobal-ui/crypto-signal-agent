name: Crypto Signal Scan

on:
  schedule:
    - cron: "7 * * * *"     # every hour at minute 7 (UTC). GitHub may start it a few minutes late.
    - cron: "22 * * * *"    # 2026-10-31: GitHub started only 9 of 48 scheduled scans in 2 days. Four chances an hour;
    - cron: "37 * * * *"    # the gate job below lets a scheduled run scan only when the last scan saved 45+ minutes
    - cron: "52 * * * *"    # ago (otherwise it cancels itself), so it is still about one scan an hour.
  workflow_dispatch:         # lets you press "Run workflow" by hand
    inputs:
      test_email:
        description: "Send a test email"
        type: boolean
        default: false
      sample_emails:
        description: "Send one TEST email of each type (after the scan, from today's numbers)"
        type: boolean
        default: false

permissions:
  actions: read              # notify.py reads the previous runs: one failure = silent retry, 2 in a row = one email
  pull-requests: read        # the daily / weekly emails list the merged pull requests (BUILT, progress history)
  contents: write            # needed to save the reports back into the repo

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 on 19 Oct 2026
    timeout-minutes: 30
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      ALERT_TO: ${{ secrets.ALERT_TO }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Test email
        if: ${{ inputs.test_email }}
        run: python notify.py test

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore the daily research results (branch live-reports)
        run: python publish_live.py --restore

      - name: Record futures data (funding, open interest, long/short, taker - history grows hourly; never stops the run)
        continue-on-error: true
        run: python derivs.py

      - name: Scan, backtest, find signals
        env:
          GITHUB_TOKEN: ${{ github.token }}   # only to read the repository size for the report
        run: python scanner.py

      - name: Trend portfolio (paper, once per daily close; never stops the run)
        continue-on-error: true
        run: python trend_portfolio.py

      - name: Your own trades (journal sync - branch journal from the live watcher; nothing when not set up)
        continue-on-error: true
        run: python journal_review.py

      - name: Email LIVE and PAPER signals and trade updates (each trade one email thread; max 3 PAPER emails an hour)
        continue-on-error: true
        run: python notify.py

      - name: Briefing / daily review from engine numbers only, when Claude's report did not arrive (once a day)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}   # merged pull requests and the test runs, for the daily email
        run: python notify.py daily

      - name: Weekly report email (Sunday, first scan from 04:00 UTC = 12:00 Beijing)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}   # merged pull requests and the test runs, for the weekly email
        run: python notify.py weekly

      - name: ALERT / FIXED emails (market data unsafe, risk halt) and reminders
        continue-on-error: true
        run: python notify.py system

      - name: Outside feeds for Claude's tasks (news, Fear & Greed, Binance notices, Deribit expiries - never stops the run)
        continue-on-error: true
        run: python feeds.py

      - name: Memory guard (append-only files may only grow - section 17)
        run: python memory_guard.py

      - name: Save reports
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git config merge.append.name "append-only files: keep both additions whole"
          git config merge.append.driver "python3 append_merge.py %O %A %B"   # .gitattributes: merge=append
          git add reports memory
          git commit -m "Scan $(date -u +'%Y-%m-%d %H:%M') UTC" || echo "Nothing new"
          # newest main (git_sync.sh: clashing generated reports - this run's copies win), the merge broke no
          # append-only file and no lab card, then push. Retried: GitHub sometimes answers a push with "Internal
          # Server Error" (scan of 14 Oct 2026, 15:37 UTC lost its results that way).
          for i in 1 2 3 4; do
            bash git_sync.sh && python memory_guard.py --after-sync && git push && exit 0
            echo "save: try $i failed - retrying"
            sleep $((i * 10))
          done
          exit 1

      - name: Publish the large report files (branch live-reports, one commit, no history)
        run: python publish_live.py

      - name: Dashboard (GitHub Pages, branch gh-pages - never stops the run)
        continue-on-error: true
        run: python build_dashboard.py --publish

      - name: Test emails (one of each type, marked TEST)
        if: ${{ inputs.sample_emails }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python notify.py samples

      - name: Email "fixed" once after 2+ failed scans in a row
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python notify.py recovered scan

      - name: Email if the scan failed twice in a row
        if: ${{ failure() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 notify.py failed

  gate:
    # A scheduled run scans only when the last scan saved (reports/latest.md on main) 45+ minutes ago; a started run
    # (Run workflow, the PC watcher's kick) always scans. A run with nothing to do cancels itself: a cancelled run is
    # not counted by the "failed twice in a row" email (notify.earlier_runs skips it).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write         # only to cancel this run
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            last=$(gh api "repos/${{ github.repository }}/commits?path=reports/latest.md&sha=main&per_page=1" \
                   --jq '.[0].commit.committer.date' || echo "")
            if [ -n "$last" ]; then
              age=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 60 ))
              echo "last scan saved $age minutes ago ($last)"
              [ "$age" -lt 45 ] && run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = "false" ]; then
            echo "A scan saved less than 45 minutes ago - this scheduled run is not needed."
            gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"
            sleep 60
          fi
