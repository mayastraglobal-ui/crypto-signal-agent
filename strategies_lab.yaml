# =====================================================================
#  STRATEGY LAB (Phase 17) - new strategy cards written by Claude's daily review and weekly research
#
#  Same card format as strategies.yaml (read its header for every field and the building blocks).
#  The daily research run tests these cards EXACTLY like strategies.yaml: same fees, same gates, same
#  walk-forward / costs +50% / +-20% / control-twin tests, same trials counter. A lab card may reach
#  BACKTESTING / VALIDATION / PAPER_TRADING on its own, but it NEVER sends live emails and is never APPROVED:
#  to approve one, copy the card unchanged into strategies.yaml by pull request, then add the approvals line.
#  (Once the same id + version is in strategies.yaml, the copy here is ignored.)
#
#  Rules for additions (the Brain guard refuses the whole push otherwise):
#    * cards are only ADDED at the end - never change or delete one (the operator corrects the file);
#    * status FORMALIZED; a NEW id, or a NEW version of an existing id that changes exactly ONE thing
#      (with a changelog line);
#    * only the building blocks of strategies.yaml (no other code); first target >= 2R;
#    * a control twin (twin_of: this id) when the card uses an SMC / ICT ingredient or the 5m check;
#    * source + evidence_class (FACT / RESEARCH_FINDING / BACKTEST_EVIDENCE / CLAIM / HYPOTHESIS /
#      MODEL_OUTPUT / UNVERIFIED_OPINION) and added: "YYYY-MM-DD" (today, UTC);
#    * at most 3 new cards per day and 10 per 7 days (a control twin counts as a card).
# =====================================================================

- id: R4-BBRSI
  version: '1.0'
  status: FORMALIZED
  family: mean_reversion
  gate: mean_reversion
  regimes:
  - RANGE
  - HIGH_VOL_RANGE
  source: R4 freqtrade-strategies, file user_data/strategies/berlinguyinca/BbandRsi.py (commit f3340ce) - the idea
    rewritten in our building blocks; no code copied (GPL-3.0)
  source_url: https://github.com/freqtrade/freqtrade-strategies/blob/f3340ce11f5bdf62f598522e64d1f5638eaa13f5/user_data/strategies/berlinguyinca/BbandRsi.py
  evidence_class: 'UNVERIFIED_OPINION: a community strategy file, published without evidence; tested here like any
    idea'
  factory: literature
  factory_evidence: 'freqtrade-strategies berlinguyinca/BbandRsi.py: long entry as in the file (RSI < 30, close
    < lower band), plus the mirror-image short; exits kept (RSI > 70 / < 30); first target 2R instead of the file''s
    10% ROI'
  parent: 'source: [R4] freqtrade-strategies'
  hypothesis: In a range, a close below the lower Bollinger band with RSI(14) under 30 is an over-reaction that
    snaps back.
  timeframes:
  - 1h
  - 30m
  description: Buy when RSI is oversold AND price closes below the lower Bollinger band; sell the mirror image.
  params:
    rsi_n: 14
    lo: 30
    hi: 70
    bb_n: 20
    bb_k: 2
  long:
  - rsi(close,{rsi_n}) < {lo}
  - close < bb_lower(close,{bb_n},{bb_k})
  short:
  - rsi(close,{rsi_n}) > {hi}
  - close > bb_upper(close,{bb_n},{bb_k})
  exit_long:
  - rsi(close,{rsi_n}) > {hi}
  exit_short:
  - rsi(close,{rsi_n}) < {lo}
  stop:
    method: atr
    atr: 1.5
- id: donchian_breakout-VEXIT
  version: '1.0'
  status: FORMALIZED
  family: breakout
  gate: trend
  regimes:
  - STRONG_BULL
  - WEAK_BULL
  - STRONG_BEAR
  - WEAK_BEAR
  - EXPANSION
  - COMPRESSION
  source: 'engine variant search: one change to donchian_breakout@1.0'
  hypothesis: 'One change to donchian_breakout@1.0: targets 2R / 3R (50 / 50) instead of a first target below 2R.
    It should keep the edge of donchian_breakout@1.0 and remove part of its losses; tested because it was the strongest
    BACKTESTING cell this week.'
  timeframes:
  - 4h
  - 1h
  - 30m
  description: 'Turtle-style breakout: price closes above the highest high of the last 20 candles with strong volume.'
  logic: Breakouts of a 20-candle range with 1.5x normal volume show new buyers stepping in. ADX > 20 confirms the
    market is trending, not chopping. This is the family of rules with the best published long-term evidence in
    crypto (trend following).
  params:
    n: 20
    vol_x: 1.5
    adx_min: 20
    exit_n: 10
  long:
  - htf_up
  - close > prev(highest(high,{n}))
  - volume > vol_sma(20) * {vol_x}
  - adx(14) > {adx_min}
  short:
  - htf_down
  - close < prev(lowest(low,{n}))
  - volume > vol_sma(20) * {vol_x}
  - adx(14) > {adx_min}
  exit_long:
  - close < prev(lowest(low,{exit_n}))
  exit_short:
  - close > prev(highest(high,{exit_n}))
  stop:
    method: atr
    atr: 2.0
  time_stop_bars: 60
  cooldown_bars: 0
  known_weaknesses: Many false breakouts in chop; wide stops; most of the profit comes from a few big trends.
  edge:
    type: forced_flow
    works_in:
    - STRONG_BULL
    - WEAK_BULL
    - STRONG_BEAR
    - WEAK_BEAR
    - EXPANSION
    - COMPRESSION
    who_pays: traders fading the breakout (short at the range top) whose stops then add fuel to the move
    mechanism: a close outside a 20-candle range with 1.5x volume marks new participation; trend-following has the
      longest published record of the idea families
    fails_when: 'choppy ranges and low volume: most breakouts fall back inside'
    kill_rule: retired by the engine's paper rules (last 20 paper signals below -0.10R or 8R drawdown), or FAILED
      when the unseen-data part of the backtest turns negative
  changelog:
  - '1.0 (2026-09-26): engine variant of donchian_breakout@1.0 - targets 2R / 3R (50 / 50) instead of a first target
    below 2R'
  targets:
    long:
    - 2R
    - 3R
    short:
    - 2R
    - 3R
    split:
    - 0.5
    - 0.5
  time_stop_bars: 24
  cooldown_bars: 0
  known_weaknesses: Catches falling knives when a range breaks into a trend; the original has no trend filter.
  edge:
    type: behavioural
    works_in:
    - RANGE
    - HIGH_VOL_RANGE
    who_pays: traders who panic-sell (or chase) a stretched candle at the edge of a range
    mechanism: in a range, extremes beyond the Bollinger band with an extreme RSI tend to revert to the mean
    fails_when: 'a range breaks into a trend: the band keeps being walked and every entry is early'
    kill_rule: unseen-data average below 0R, or it fails the costs +50% test
  changelog:
  - '1.0: rewritten from freqtrade-strategies BbandRsi.py (R4) - long entry as in the file (RSI < 30, close < lower
    band), plus the mirror-image short; exits kept (RSI > 70 / < 30); first target 2R instead of the file''s 10%
    ROI'
  added: '2026-09-26'
  added: '2026-09-26'
  factory: variant_search
  variant_of: donchian_breakout@1.0
  parent: 'result: donchian_breakout@1.0 4h'
  evidence_class: BACKTEST_EVIDENCE
  factory_evidence: 'donchian_breakout@1.0 4h: 1105 trades, avg +0.123R, unseen part +0.149R (361 trades); change:
    targets 2R / 3R (50 / 50) instead of a first target below 2R'
