    version: V1
  source: 'Forward Test Program (operator plan 2026-10-09): strategy 4, Trend momentum (MACD + Supertrend) - version V1'
  evidence_class: 'HYPOTHESIS: an idea family to be tested; no evidence until the backtest and the live tracking say so'
  parent: 'card: supertrend_flip@1.0'
  hypothesis: A fresh MACD momentum push in the direction of the Supertrend and of the 4H + 1H trend starts the next leg
    of the trend.
  timeframes:
  - 4h
  description: Supertrend(10,3) is up and the MACD line crosses above its signal line while above zero (shorts mirrored);
    exit when the Supertrend flips.
  params:
    st_n: 10
    st_x: 3.0
  long:
  - supertrend_dir({st_n},{st_x}) > 0
  - cross_up(macd_line(close), macd_signal(close))
  - macd_line(close) > 0
  short:
  - supertrend_dir({st_n},{st_x}) < 0
  - cross_down(macd_line(close), macd_signal(close))
  - macd_line(close) < 0
  exit_long:
  - supertrend_dir({st_n},{st_x}) < 0
  exit_short:
  - supertrend_dir({st_n},{st_x}) > 0
  stop:
    method: atr
    atr: 2.0
  targets:
    long:
    - 2R
    - 3R
    short:
    - 2R
    - 3R
    split:
    - 0.5
    - 0.5
  time_stop_bars: 60
  cooldown_bars: 0
  known_weaknesses: 'Lagging indicators: entries come after part of the move; many whipsaws when the trend is flat.'
  edge:
    type: behavioural
    works_in:
    - STRONG_BULL
    - WEAK_BULL
    - STRONG_BEAR
    - WEAK_BEAR
    - EXPANSION
