- id: P02-EMA-PULLBACK-V1
  version: '1.0'
  status: FORMALIZED
  family: mtf_pullback
  gate: intraday
  regimes:
  - STRONG_BULL
  - WEAK_BULL
  - STRONG_BEAR
  - WEAK_BEAR
  - EXPANSION
  program:
    strategy: 2
    name: EMA trend pullback (EMA20/50 + RSI + VWAP)
    version: V1
  source: 'Forward Test Program (operator plan 2026-10-09): strategy 2, EMA trend pullback (EMA20/50 + RSI + VWAP) - version
    V1'
  evidence_class: 'HYPOTHESIS: an idea family to be tested; no evidence until the backtest and the live tracking say so'
  parent: 'card: trend_pullback@1.0'
  hypothesis: A pullback to the 20 EMA inside a 4H + 1H trend, with momentum reset but not broken and buyers since the last
    swing low still in profit, continues the trend.
  timeframes:
  - 4h
  description: In a trend (EMA20 above EMA50) price dips to the 20 EMA and closes back above it with RSI 40-65, above the
    VWAP anchored at the last swing low (shorts mirrored).
  params:
    fast: 20
    slow: 50
    rsi_n: 14
    rsi_lo: 40
    rsi_hi: 65
  long:
  - ema(close,{fast}) > ema(close,{slow})
  - low <= ema(close,{fast})
  - close > ema(close,{fast})
  - close > open
  - rsi(close,{rsi_n}) > {rsi_lo}
  - rsi(close,{rsi_n}) < {rsi_hi}
  - close > avwap_swing_low
  short:
  - ema(close,{fast}) < ema(close,{slow})
  - high >= ema(close,{fast})
  - close < ema(close,{fast})
  - close < open
  - rsi(close,{rsi_n}) < 100 - {rsi_lo}
  - rsi(close,{rsi_n}) > 100 - {rsi_hi}
  - close < avwap_swing_high
  exit_long:
  - close < ema(close,{slow})
  exit_short:
  - close > ema(close,{slow})
  stop:
    method: atr
    atr: 1.5
  targets:
    long:
    - 2R
    - 3R
    short:
    - 2R
    - 3R
    split:
    - 0.5
    - 0.5
  time_stop_bars: 30
  cooldown_bars: 0
  known_weaknesses: Fails in ranges (every EMA touch looks like a pullback); late in a trend the bounce is often the last
    one.
  edge:
    type: behavioural
    works_in:
    - STRONG_BULL
    - WEAK_BULL
    - STRONG_BEAR
    - WEAK_BEAR
    who_pays: traders who sold the dip into a trend the higher timeframes still support
    mechanism: trends persist; a pullback to the 20 EMA resets momentum and buyers step in at 'value'
    fails_when: ranges and the last leg of a mature trend, where the bounce fails
    kill_rule: FAILED when the unseen-data part of the backtest turns negative; demoted by the weekly review when its live
      results turn negative
  changelog:
  - '1.0 (2026-10-09): Forward Test Program V1 - base version on 4H'
  added: '2026-10-09'
