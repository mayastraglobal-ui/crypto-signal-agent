# =====================================================================
#  FORWARD TEST PROGRAM (operator plan 2026-10-09) - 10 different strategies x 4 versions
#
#  Same card format as strategies.yaml (read its header for every field and building block). These cards are
#  tested EXACTLY like the library: same fees, same walk-forward / costs +50% / +-20% / trials counter, same pass
#  bar. Like a lab card a program card is never APPROVED from here: to approve one, copy it unchanged into
#  strategies.yaml by pull request, then add the approvals line.
#
#  Written by the operator's pull requests only (the Brain may not edit this file). The engine may ADD new
#  versions of a program strategy to strategies_lab.yaml (variant search); a running card is never edited.
#
#  The four versions of every strategy (each differs from V1 in ONE way):
#    V1  base: 4H (strategy 8, the session breakout: 1H)
#    V2  faster: the same rules on 1H / 30m / 15m (4H + 1H still decide the direction)
#    V3  V1 + the daily regime must agree (dir_1d) - shows whether the daily filter helps or only blocks moves
#    V4  V1 with a trailing ATR exit after TP1 (targets 2R / 10R, stop trails 3 ATR(22) behind the extreme)
#    V5  V2 with the fast 4H trend (4H close and EMA20 vs EMA50) instead of the 4H regime label - only the trend
#        strategies (gate intraday); added 2026-10-09 after the 6-9 Oct fall, when the 4H regime never turned bear
#
#  Market gates of the program (engine/lifecycle.py):
#    intraday           trend strategies: the 4H AND the 1H regime must point the same way; 1W / 1D never block
#    intraday_reversal  range / fade strategies: only in their regimes, never against a STRONG 4H trend
#    intraday_fast      V5: like intraday, but the 4H direction comes from the 4H EMA20 / EMA50 (faster)
#
#  Research tests the program in nightly batches (config.yaml -> program): the strategies tested longest ago
#  go first, so the first full pass takes about 5 nights, then it keeps rotating.
# =====================================================================

- id: P01-BREAKOUT-V1
  version: '1.0'
  status: FORMALIZED
  family: breakout
  gate: intraday
  regimes:
  - STRONG_BULL
  - WEAK_BULL
  - STRONG_BEAR
  - WEAK_BEAR
  - EXPANSION
  program:
    strategy: 1
    name: Breakout (Donchian + volume + ADX)
    version: V1
  source: 'Forward Test Program (operator plan 2026-10-09): strategy 1, Breakout (Donchian + volume + ADX) - version V1'
  evidence_class: 'HYPOTHESIS: an idea family to be tested; no evidence until the backtest and the live tracking say so'
  parent: 'card: donchian_breakout@1.0'
  hypothesis: When 4H and 1H trend the same way, a close outside the 20-candle range with strong volume and a trending ADX
    starts a move worth following.
  timeframes:
  - 4h
  description: 'Price closes above the highest high of the last 20 candles with 1.5x volume and ADX above 20 (shorts: below
    the lowest low).'
  params:
    n: 20
    vol_x: 1.5
    adx_min: 20
    exit_n: 10
  long:
  - close > prev(highest(high,{n}))
  - volume > vol_sma(20) * {vol_x}
  - adx(14) > {adx_min}
  short:
  - close < prev(lowest(low,{n}))
  - volume > vol_sma(20) * {vol_x}
  - adx(14) > {adx_min}
  exit_long:
  - close < prev(lowest(low,{exit_n}))
  exit_short:
  - close > prev(highest(high,{exit_n}))
  stop:
    method: atr
    atr: 2.0
  targets:
    long:
    - 2R
    - 3R
    short:
    - 2R
    - 3R
    split:
    - 0.5
    - 0.5
  time_stop_bars: 60
  cooldown_bars: 0
  known_weaknesses: Many false breakouts in chop; wide stops; most of the profit comes from a few big trends.
  edge:
    type: forced_flow
    works_in:
    - STRONG_BULL
    - WEAK_BULL
    - STRONG_BEAR
    - WEAK_BEAR
    - EXPANSION
    who_pays: traders fading the breakout at the range edge, whose stops then add fuel to the move
    mechanism: a close outside a 20-candle range with 1.5x volume marks new participation; trend following has the longest
      published record of the idea families
    fails_when: 'choppy ranges and low volume: most breakouts fall back inside the range'
    kill_rule: FAILED when the unseen-data part of the backtest turns negative; demoted by the weekly review when its live
      results turn negative
  changelog:
  - '1.0 (2026-10-09): Forward Test Program V1 - base version on 4H'
  added: '2026-10-09'
