# ---------------------------------------------------------------------
#  STRATEGY 13 - the daily Turtle (operator request 2026-10-27: "build strategy 13"), long only. The classic trend
#  follower most trend traders use: buy when price breaks its 55-day high, keep the trade while the trend runs, exit
#  when price closes below its 20-day low. No fixed target: a few big trends pay for the many small losses. Built on
#  4H candles with day-sized windows (55 days = 330 candles, 20 days = 120, 200 days = 1200; the agent trades 4H /
#  1H, the daily is context only). Stop 5 ATR(14) of 4H ~= 2 daily ATR (median ratio 2.65 on the 7 coins).
#  The 2026-10-27 study (daily candles since 2017, 7 coins, long only, 0.1% a side + funding, 24 versions compared -
#  so expect less): plain +2.28R a trade (223 trades, 33% won, 2018 -11R, 2022 -13R); BTC above its 200-day
#  average +2.92R (166, 38% won, 2018 / 2022 0R); a strong breakout day + the coin above its 200-day average +2.67R
#  (123, drawdown 14R); a chandelier exit instead of the 20-day low was worse (+1.08R) and is not built. Shorts lost
#  (-0.14R): long only (the short rule close < 0 never fires).
#  These cards through the engine (4H since 2017, 7 coins, the nightly costs; checked 2026-10-27): V1 +1.83R a trade
#  (156 trades, 40% won, unseen last 30% +1.27R, drawdown 20.5R), V2 +2.01R (123, 46%, unseen +1.89R, drawdown 14.9R,
#  2018 / 2022 0R), V3 +1.93R (127, unseen +1.56R, drawdown 16.0R), C +0.21R (467). Not built: a retest limit at the
#  broken level (+1.91R, unseen only +0.99R; its backtest re-places the limit higher at every new high, which a live
#  order cannot do - its live record would not match the test).
#  One trade at a time (one_trade: true): the breakout rule is true on every new 4H high of a rally; live and in the
#  hourly record a signal counts only when the card's own backtest on the same candles takes it - the trade from the
#  first break is still open, so the later highs are not new trades (as tested). A "new trend only" rule instead
#  (a close below the 20-day low since the last break) blocked the re-entries after a stop: +1.51R a trade, not +1.83R.
#    V1  plain 55-day breakout              V2  V1 + BTC above its 200-day average (the bull-market filter)
#    V3  strong breakout + the coin above its own 200-day average
#    C   control: the same breakout with quick fixed targets (2R / 3R, 5-day hold), no 20-day exit - shows whether
#        riding the trend is what makes the money. A benchmark, never an alert.
#  Market entry (entry: market): the 🎯 pullback rule of the TEST alerts does not apply - the big trends
#  rarely come back, and missing one costs more than the better price saves.
# ---------------------------------------------------------------------
