  evidence_class: 'HYPOTHESIS: an idea family to be tested; no evidence until the backtest and the live tracking say so'
  parent: 'card: liquidity_sweep_reversal@1.0'
  hypothesis: 'A sweep of the stops under a pullback low followed by a strong close above the recent highs is the end of
    the pullback: the trend resumes.'
  timeframes:
  - 4h
  description: Inside the trend, price dips below the 20-candle low (a sweep of the stops there), then within 5 candles
    a strong candle closes above the highest high of the last 5 (structure shift); stop below the sweep low (shorts mirrored).
    Plain building blocks, no SMC detector.
  params:
    n: 20
    k: 5
  long:
  - within(low < prev(lowest(low,{n})), {k})
  - close > prev(highest(high,{k}))
  - displacement_up
  short:
  - within(high > prev(highest(high,{n})), {k})
  - close < prev(lowest(low,{k}))
  - displacement_down
  stop:
    method: structure
    long_level: lowest(low,{k})
    short_level: highest(high,{k})
    buffer_atr: 0.2
    max_width_atr: 3.0
  targets:
    long:
    - 2R
    - 3R
    short:
    - 2R
    - 3R
    split:
    - 0.5
    - 0.5
  time_stop_bars: 30
  cooldown_bars: 0
  known_weaknesses: A sweep can be the start of a real breakdown; the structure-shift candle is often large, so the stop
    is wide.
  edge:
    type: forced_flow
    works_in:
    - STRONG_BULL
    - WEAK_BULL
    - STRONG_BEAR
    - WEAK_BEAR
    who_pays: traders whose stop-losses sit under the obvious low and are filled at the worst price
    mechanism: stop orders under a low give large players the liquidity to buy; once filled, a strong close back above the
      recent highs shows the selling is done
    fails_when: 'real breakdowns: the low breaks and price keeps going'
    kill_rule: FAILED when the unseen-data part of the backtest turns negative; demoted by the weekly review when its live
      results turn negative
