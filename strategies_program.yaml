# ---------------------------------------------------------------------
#  STRATEGY 11 - early momentum (operator request 2026-10-13, docs/STRATEGY_11.md)
#  On 11-12 Oct every coin rallied / fell for hours on 1H / 30m with no alert: the 4H had not turned, so the trend
#  gates waited. Strategy 11 has its own gate, intraday_momentum: the 1H already moving that way (1H close beyond its
#  EMA20 and beyond the close 6 hours earlier) and the 4H not in a STRONG trend against it. To keep the fake breaks
#  out it asks for a MARKET-WIDE break (mkt_up / mkt_dn: at least 3 of the operator's coins), BTC moving the same way,
#  the coin moving at least as hard as BTC, and an EARLY step only (steps_up / steps_dn <= 2, RSI not stretched, not
#  more than 2.5 ATR from the EMA20) - never the 3rd break near the bottom. Both directions, tested separately.
#    V1  30m early break                 V2  V1 + 24-hour level + squeeze before     V3  V2 on 1H
#    V4  30m retest (pullback to the EMA20 after the break)                          C   control: the plain breakout
#  The control is a benchmark (V1 must beat it) and never sends an alert.
# ---------------------------------------------------------------------
