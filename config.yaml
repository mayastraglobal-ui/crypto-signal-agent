# =====================================================================
#  CRYPTO SIGNAL AGENT - SETTINGS
#  This is the file you edit to change how the agent behaves.
#  Lines starting with # are notes and are ignored by the program.
# =====================================================================

account:
  size_usdt: 1000            # your trading account size (used for position-size examples)
  risk_per_trade_pct: 0.5    # max you lose if the stop-loss is hit. TradeSentry v3: 0.5% while
                             # validating and in the first live month, never above 1%
  max_open_trades: 3         # never hold more than this many trades at once

market:
  quote: USDT
  min_listing_days: 180      # coin must have 180+ days of price history (skips brand-new coins)
  always_include: [BTC, ETH] # always in the signal list when they pass every rule (AGENT_PROMPT.md §4)

  # ---- Coins the agent will NEVER trade. Add or remove tickers freely. ----
  exclude_meme: [DOGE, SHIB, PEPE, FLOKI, BONK, WIF, BOME, MEME, PEOPLE, TURBO, NEIRO,
                 1000SATS, DOGS, PNUT, ACT, TRUMP, BANANAS31, BROCCOLI714, 1MBABYDOGE,
                 MUBARAK, TST, CHEEMS, POPCAT, MOODENG, PENGU, FARTCOIN, SPX, GOAT, BABYDOGE,
                 LUNC, USTC, NOT, HMSTR, CATI, BANANA, SLERF, MEW, BRETT, MOG, GIGA, WLFI]
  exclude_ai:   [FET, AGIX, OCEAN, TAO, RNDR, RENDER, WLD, ARKM, AI, NFP, AIXBT, VIRTUAL,
                 COOKIE, IO, PHB, CGPT, AI16Z, GRIFFAIN, KAITO, SAHARA, ALCH, VANA, AIOZ,
                 GLM, AKT, ATH, NMR, IQ, THETA, SWARMS, ZEREBRO, HOOK, MDT, ORAI,
                 NEAR]       # NEAR: markets itself as "the blockchain for AI" (operator decision 2026-09-24)
  exclude_other: [USDC, FDUSD, TUSD, USDP, DAI, BUSD, EUR, AEUR, EURI, USD1, USDE, XUSD,
                  BFUSD, WBTC, WBETH, BNSOL, STETH, USDS, RLUSD, PYUSD, EURC]
  exclude_gold:  [PAXG, XAUT]
  # Unknown stablecoins are ALSO caught by behaviour: see universe -> stablecoin_band_pct.

universe:                    # which coins the agent watches (AGENT_PROMPT.md section 4)
  signal_coins: 7            # top 7 eligible coins by 24h volume: the ONLY coins that can give signals
  research_coins: 10         # the 7 + the next 3: those 3 are backtested only, never a signal
  hysteresis_runs: 2         # a new coin must be in the top 7 for 2 runs in a row to join,
                             # and a member outside the top 7 for 2 runs in a row leaves.
                             # A member that breaks a rule below leaves IMMEDIATELY.
  candidate_pool: 20         # how many high-volume coins get the detailed checks each run
  # --- eligibility rules: ALL must pass ---
  min_24h_volume_usdt: 50000000     # $50M+ traded in the last 24h
  min_7d_avg_volume_usdt: 50000000  # ... and $50M+ per day on average over 7 days
  max_volume_spike_x: 3      # 24h volume above 3x the 7-day average = a one-day spike -> not eligible
  max_abs_24h_move_pct: 25   # moved more than ±25% in 24h -> suspended for the rest of the UTC day
  max_spread_pct: 0.10       # gap between best buy and best sell price
  min_depth_usdt_1pct: 250000  # at least $250k of orders on EACH side within 1% of the price
  stablecoin_band_pct: 2     # price stayed within ±2% for 30 days = behaves like a stablecoin
  stablecoin_days: 30
  wash_volume_flag_ratio: 1000 # 24h volume > 1000x the 1% order-book depth = "possible wash volume".
                               # FLAG ONLY for now (operator decision): review after a week of data.


# How many candles (bars) of history to download for each timeframe.
# More bars = more backtest trades = more reliable results (but slower).
timeframes:
  "1w": 500      # ~10 years, or since the coin was listed (higher-timeframe context)
  "1d": 1000     # ~2.7 years (higher-timeframe context + later long backtests)
  "4h": 1500     # ~250 days
  "1h": 2000     # ~83 days
  "30m": 2000    # ~42 days
  "15m": 2000    # ~21 days
  "5m": 2000     # ~7 days

timeframe_model:             # which timeframe does what (AGENT_PROMPT.md section 5)
  # chain = from slow to fast. The last 3 are: setup -> trigger -> entry (execution);
  # the ones before them give permission (bias). veto = a timeframe that can block a trade.
  # This is a HYPOTHESIS: models A-D are compared with identical tests in later phases.
  active: B
  models:
    A: {chain: [7d, 1d, 4h, 1h, 15m, 5m]}
    B: {chain: [1d, 4h, 1h, 30m, 15m, 5m], veto: 1w}    # default
    C: {chain: [7d, 1d, 1h, 30m, 15m, 5m]}
    D: {chain: [1d, 2h, 30m, 15m, 5m]}                  # 2h is downloaded only once D is tested

costs:                       # realistic trading costs - never set these to 0!
  # Exchange not chosen yet, so we use Binance's standard (VIP 0, no BNB discount) fees.
  long:                      # LONG trades = buying on the SPOT market
    taker_fee_pct: 0.10      # market order fee (Binance spot)
    maker_fee_pct: 0.10      # limit order fee (Binance spot)
    slippage_pct: 0.05       # price moves against you when a market order fills
  short:                     # SHORT trades = FUTURES ONLY (you cannot short on spot)
    taker_fee_pct: 0.05      # market order fee (Binance USDT-M futures)
    maker_fee_pct: 0.02      # limit order fee (Binance USDT-M futures)
    slippage_pct: 0.05
    funding_pct_per_8h: 0.01 # futures "funding" fee, paid every 8 hours while the trade is open.
                             # Real funding changes sign; we cautiously ALWAYS charge it to the short.

data_quality:                # safety checks on the price data, every run (AGENT_PROMPT.md section 3)
  # GOOD = signals allowed · DEGRADED = analysis only · UNSAFE = no signals
  stale_periods: 2           # newest closed candle older than 2 candle-lengths -> UNSAFE
  max_missing_pct: 1.0       # more than 1% of candles missing -> UNSAFE
  recent_bars: 300           # any missing candle among the newest 300 -> DEGRADED
  volume_median_bars: 50     # "normal volume" = median of the 50 candles before
  volume_check_bars: 3       # check the newest 3 closed candles for volume spikes
  volume_spike_warn: 10      # 10x normal volume -> note only (real breakouts do this)
  volume_spike_degraded: 50  # 50x normal volume -> probably bad data -> DEGRADED
  cross_venue_max_pct: 0.5   # Binance vs OKX price differ by more than 0.5% -> DEGRADED
  system_unsafe_coin_share: 0.30   # BTC UNSAFE, or >30% of coins UNSAFE -> ALL signals stop
                                   # (DATA_STALE / SIGNAL_DISABLED) + a [SYSTEM] email

trade_plan:                  # the TP1 / TP2 / TP3 structure used for EVERY signal
  tp_r: [1.0, 2.0, 3.0]      # TP1 = 1R, TP2 = 2R, TP3 = 3R  (R = distance entry -> stop-loss)
  tp_split: [0.4, 0.3, 0.3]  # close 40% at TP1, 30% at TP2, 30% at TP3
  move_stop_to_breakeven_after_tp1: true
  move_stop_to_tp1_after_tp2: true

validation:                  # rules a strategy must pass, or it is IGNORED
  in_sample_share: 0.7       # first 70% of history = "training", last 30% = "unseen test"
  min_trades: 30             # need at least 30 backtest trades (all coins together)
  min_oos_trades: 10         # at least 10 trades in the unseen test period
  min_expectancy_r: 0.05     # must make on average +0.05R per trade AFTER fees
  min_profit_factor: 1.15    # gross wins / gross losses
  min_coin_trades: 5         # a coin needs 5+ trades with this strategy to be "proven" on it
  forward_pause_after: 20    # after 20 LIVE signals ...
  forward_pause_below_r: -0.10   # ... if live average is below -0.10R, pause the strategy

signals:
  lookback_bars: 2           # a signal stays valid for this many closed candles
  max_in_report: 10          # show the best N signals
  allow_shorts: true         # false = long only (spot traders cannot short)
