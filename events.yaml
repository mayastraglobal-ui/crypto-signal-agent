# Fields: utc, type (NFP / CPI / PCE / FOMC / GDP / ...), name, source (the official page), check (how the date was
# checked). `check` values:
#   official_page    - read on the official calendar page itself
#   official_search  - read from the official site through a web search restricted to that site; the page itself
#                      could not be opened from the engine's network - re-check on the page when you can
#   indirect         - supported by a related official release, not by the main calendar
#   operator         - given by the operator, not confirmed yet
# Only ADD entries here. The weekly research task appends new ones (checked by the Brain guard, which refuses any
# edit or deletion). Corrections and deletions are made by the operator (edit on GitHub).
# An exchange incident: {from: "2026-10-02 08:00", until: "2026-10-02 11:00", type: exchange_incident, name: "..."}

