# No live entry from 60 minutes before to 60 minutes after each event (config.yaml -> risk.blackout_minutes).
# The engine reads this file AND config.yaml -> events (both together). Times are UTC.
#   US data at 8:30 a.m. New York = 12:30 UTC until 1 Nov 2026 (summer time), 13:30 UTC from 1 Nov (winter time).
#   FOMC statement at 2:00 p.m. New York = 18:00 UTC (summer) / 19:00 UTC (winter).
