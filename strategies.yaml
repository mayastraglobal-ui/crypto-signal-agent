  hypothesis: "With the higher timeframes aligned, a sell-side sweep followed by a market-structure shift with displacement, entered on the first retrace into a fair value gap, continues to the opposing liquidity pool."
  timeframes: ["30m", "15m"]
  description: "Sweep of liquidity -> structure shift (CHoCH with displacement) -> first pullback into the gap."
  logic: >-
    Stops under a low are taken (sweep), then price breaks structure the other way with a strong
    candle (market-structure shift). The gap that strong move leaves behind is where we enter, the
    stop goes beyond the sweep's extreme, and the target is the next liquidity pool on the other side.
  params: {sweep_bars: 20, mss_bars: 10}
  long:
