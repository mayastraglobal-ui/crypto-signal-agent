# ---------------------------------------------------------------------
# Roadmap step 5 part 1 (operator, 2026-10-06): "the proven trend, a faster entry". The 4H Donchian breakout is the
# one family with a measured edge; trend4h_long / _short (engine/trend4h.py) say when its 4H trade would be open.
# These cards trade only inside that window, entering on 1H / 30m / 15m / 5m with a limit order at a better price,
# 2R / 3R targets and the fee cap (no trade when fees + slippage would cost more than 0.25R). Each has a control
# twin without the window, so the research shows whether the 4H trend is what makes them work.
# ---------------------------------------------------------------------
- id: TRD-H4-PULLBACK
  version: "1.0"
  status: FORMALIZED
  family: mtf_pullback
  gate: trend
  regimes: [STRONG_BULL, WEAK_BULL, STRONG_BEAR, WEAK_BEAR, EXPANSION, COMPRESSION, RANGE, TRANSITION]
  source: "Roadmap step 5: the 4H Donchian trend (the library's measured edge) with a faster pullback entry"
  hypothesis: "While the 4H Donchian breakout trade is open, a pullback to the EMA20 on a faster timeframe that closes back in the trend direction is a better-priced entry into the same trend."
  timeframes: ["1h", "30m", "15m", "5m"]
  description: "Inside the 4H Donchian trend window: price dips to the EMA20 and closes back above it with a bullish candle (shorts mirrored); limit entry 0.25 ATR below the close."
  logic: >-
    trend4h_long = the 4H Donchian setup would hold a long now (engine/trend4h.py, frozen rules). On the trade
    timeframe: the candle's low touched the EMA20, it closed above the EMA20 and above its open. Limit 0.25 ATR
    below the close for 3 candles (maker fee). Stop 2 ATR; targets 2R and 3R; exit when the 4H window closes.
    No trade when fees + slippage would cost more than 0.25R.
  long: ["trend4h_long == 1", "low <= ema(close,20)", "close > ema(close,20)", "close > open"]
  short: ["trend4h_short == 1", "high >= ema(close,20)", "close < ema(close,20)", "close < open"]
  exit_long: ["trend4h_long != 1"]
  exit_short: ["trend4h_short != 1"]
  entry: {type: limit, offset_atr: 0.25, valid_bars: 3}
  stop: {method: atr, atr: 2.0, max_cost_r: 0.25}
  targets:
    long: ["2R", "3R"]
    short: ["2R", "3R"]
    split: [0.5, 0.5]
  time_stop_bars: 48
  cooldown_bars: 3
  control_twin: TRD-H4-PULLBACK-noT4
  known_weaknesses: "Only trades while a 4H breakout is active (a few windows a month per coin); on 5m most stops are too close for the fee cap; the limit misses pullbacks that turn at once."
  edge:
    type: behavioural
    works_in: [STRONG_BULL, WEAK_BULL, STRONG_BEAR, WEAK_BEAR, EXPANSION, COMPRESSION, RANGE, TRANSITION]
    who_pays: "traders who fade a fresh 4H breakout on its first pullback, and late sellers into value"
    mechanism: "a 4H breakout with volume and ADX starts a trend (the library's measured edge); pullbacks inside it are profit-taking, and a close back above the EMA20 shows the trend side returning, at a better price than the 4H close"
    fails_when: "false 4H breakouts that fall back inside the range, and choppy pullbacks that keep touching the EMA"
    kill_rule: "FAILED by the research when the unseen-data part of the backtest turns negative, or when it no longer beats TRD-H4-PULLBACK-noT4"
  changelog:
    - "1.0 (2026-10-06): roadmap step 5 - the 4H Donchian trend window with a faster pullback entry."

- id: TRD-H4-PULLBACK-noT4
