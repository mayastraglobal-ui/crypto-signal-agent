- id: PB-A-PULLBACK
  version: "1.0"
  status: FORMALIZED
  family: mtf_pullback
  gate: playbook
  regimes: [STRONG_BULL, WEAK_BULL, STRONG_BEAR, WEAK_BEAR]   # informational: gate playbook uses the playbook's own 1H regime
  source: "Operator's playbook section 5.1 Strategy A: Trend Pullback (docs/playbook/Crypto_Scalping_Playbook.txt)"
  hypothesis: "In a 1H trend with a matching bias, a 15m pullback into the EMA21 / VWAP zone at a marked level that ends with a 5m rejection or engulfing candle resumes the trend."
  timeframes: ["5m"]
  description: "Playbook A: 1H trend + bias, 15m pullback (>= 0.8 ATR, lower volume, higher low intact) into the EMA21/VWAP zone near a level, 5m rejection/engulfing trigger above EMA9 with volume, NY session."
  logic: >-
    pbA_long holds the whole of section 5.1: regime trend and bias bullish (1H), the 15m pullback quality,
    the EMA21/VWAP zone within 0.5 x ATR(15m) of a marked level, the 5m trigger candle (rejection or
    engulfing, close above EMA9, volume >= 1.2 x average) in the NY session (13:00-16:00 UTC, the only
    session the playbook lists for A). Funding and BTC filters from section 5.4 / 2.2. Entry: limit at the
    trigger candle's 50% (market if the candle is smaller than 0.8 x ATR). Stop: the tighter of the
    pullback low - 0.1 ATR and 1.5 ATR from entry, at least 0.8 ATR. TP1 1R (50%), TP2 the previous 15m
    swing high or the next level, at least 2R. Exit on a 15m close below the pullback low or when the 1H
    bias is no longer bullish; +0.5R within 6 candles or exit.
  long: ["pbA_long == 1", "pb_funding_ok_long == 1", "pb_btc_ok_long == 1"]
  short: ["pbA_short == 1", "pb_funding_ok_short == 1", "pb_btc_ok_short == 1"]
  exit_long: ["pb_bias_bull != 1"]
  exit_short: ["pb_bias_bear != 1"]
  entry: {type: limit, long_level: pbA_entry_long, short_level: pbA_entry_short, valid_bars: 3}
  stop: {method: structure, long_level: pbA_stop_long, short_level: pbA_stop_short, buffer_atr: 0, min_width_atr: 0.5, max_width_atr: 3.0}
  targets:
    long: ["1R", "max(2R, pbA_tp2_long)"]
    short: ["1R", "max(2R, pbA_tp2_short)"]
    split: [0.5, 0.5]
    min_rr_after_fees: 1.5
  manage:
    be_plus_fees: true
    trail: {swing_n: 3, ema: 9}
    progress: {r: 0.5, bars: 6}
    invalidate: {long: pbA_inval_long, short: pbA_inval_short, every: "15m"}
  time_stop_bars: 48
  cooldown_bars: 3
  known_weaknesses: "Few signals (1H trend + bias + NY session + pullback + trigger must all agree); a limit at the 50% level misses the fastest moves; the playbook does not say how long the limit waits (3 candles assumed)."
  edge:
    type: behavioural
    works_in: [STRONG_BULL, WEAK_BULL, STRONG_BEAR, WEAK_BEAR]
    who_pays: "late counter-trend traders who fade a trending market at its pullback, and traders who sold the dip into value"
    mechanism: "in a 1H trend, a shallow, low-volume 15m pullback into EMA21 / VWAP at a marked level is profit-taking, not a reversal; a 5m rejection shows the trend side stepping back in"
    fails_when: "ranges and trend exhaustion: the pullback becomes a reversal (the 15m higher low breaks)"
    kill_rule: "FAILED by the research when the unseen-data part of the backtest turns negative, or retired by the paper rules (last 20 paper signals below -0.10R)"
  changelog:
    - "1.0 (2026-10-06): the operator's playbook section 5.1, exactly as written. Assumptions where the playbook is silent: the limit waits 3 x 5m candles; a pullback = the candles after the highest high since the last confirmed 15m swing low."

