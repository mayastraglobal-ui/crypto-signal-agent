# H. SMC / ICT research candidates S5-S8 (AGENT_PROMPT.md section 9) and their CONTROL TWINS.
# A twin keeps the same gates, regimes, exits and hold time, but drops the SMC ingredient.
# The SMC part is only kept if it beats its twin out of sample (Phase 8 checks this formally).
# 5-minute confirmation (section 8) arrives in Phase 10 as a new version, tested against these.
# ---------------------------------------------------------------------

- id: S5-SWEEP-MSS-FVG
  version: "1.0"
  status: FORMALIZED
  family: smc
  gate: trend
  regimes: [STRONG_BULL, WEAK_BULL, STRONG_BEAR, WEAK_BEAR, EXPANSION]
  source: "ICT material (CLAIM), AGENT_PROMPT.md section 9 S5"
  hypothesis: "With the higher timeframes aligned, a sell-side sweep followed by a market-structure shift with displacement, entered on the first retrace into a fair value gap, continues to the opposing liquidity pool."
  timeframes: ["30m", "15m"]
  description: "Sweep of liquidity -> structure shift (CHoCH with displacement) -> first pullback into the gap."
  logic: >-
    Stops under a low are taken (sweep), then price breaks structure the other way with a strong
    candle (market-structure shift). The gap that strong move leaves behind is where we enter, the
    stop goes beyond the sweep's extreme, and the target is the next liquidity pool on the other side.
  long:
    - bars_since(smc_sweep_bull) <= 20
    - bars_since(smc_choch_up) <= bars_since(smc_sweep_bull)
    - bars_since(smc_choch_up) <= 10
    - smc_fvg_retrace_bull
  short:
    - bars_since(smc_sweep_bear) <= 20
    - bars_since(smc_choch_down) <= bars_since(smc_sweep_bear)
    - bars_since(smc_choch_down) <= 10
    - smc_fvg_retrace_bear
  stop: {method: structure, long_level: smc_sweep_bull_low, short_level: smc_sweep_bear_high, buffer_atr: 0.2, max_width_atr: 3.0}
  targets:
    long: [smc_liq_above]
    short: [smc_liq_below]
    split: [1.0]
    need: {long: smc_liq_above, short: smc_liq_below, min_r: 2.0}
  time_stop_bars: 30
  cooldown_bars: 4
  confirm_5m: false
  control_twin: S5-SWEEP-MSS-FVG-noSMC
  known_weaknesses: "Needs a clean sweep and shift; in chop the shift fails. Low timeframes pay a lot of fees per R."
  changelog:
    - "1.0 (2026-09-24): first version (Phase 7). No 5m confirmation yet."

- id: S5-SWEEP-MSS-FVG-noSMC
  version: "1.0"
  status: FORMALIZED
  family: smc
  gate: trend
  regimes: [STRONG_BULL, WEAK_BULL, STRONG_BEAR, WEAK_BEAR, EXPANSION]
  source: "Control twin of S5 (AGENT_PROMPT.md section 9 control-twin rule)"
  hypothesis: "Control: a plain displacement candle in the aligned direction, same exits. S5 must beat this to keep its SMC filter."
  timeframes: ["30m", "15m"]
  twin_of: S5-SWEEP-MSS-FVG
  description: "S5 without the sweep, structure shift and gap: enter after any strong candle in the trend direction."
  logic: >-
    Same gates, stop placement idea, targets and hold time as S5, but no SMC pattern.
  long:
    - displacement_up
  short:
    - displacement_down
  stop: {method: structure, long_level: "lowest(low,10)", short_level: "highest(high,10)", buffer_atr: 0.2, max_width_atr: 3.0}
  targets:
    long: [smc_liq_above]
    short: [smc_liq_below]
    split: [1.0]
    need: {long: smc_liq_above, short: smc_liq_below, min_r: 2.0}
  time_stop_bars: 30
  cooldown_bars: 4
  confirm_5m: false
  known_weaknesses: "A benchmark, not an idea to trade."
  changelog:
    - "1.0 (2026-09-24): first version (Phase 7)."

- id: S6-OB-FVG
  version: "1.0"
  status: FORMALIZED
  family: smc
  gate: trend
  regimes: [STRONG_BULL, WEAK_BULL, STRONG_BEAR, WEAK_BEAR]
  source: "ICT material (CLAIM), AGENT_PROMPT.md section 9 S6"
  hypothesis: "HTF-aligned retracements into a 4H order block inside discount (premium for shorts), triggered by a 15m CHoCH, continue in the HTF direction."
  timeframes: ["15m"]
  description: "Price pulls back into a 4H order block in the cheap half of the 4H range, then 15m structure turns up."
  logic: >-
    A 4H order block (the last opposite candle before a strong move) marks where big orders sat.
    If price returns there while it is in the cheap (discount) half of the 4H range, and the 15m
    chart then shifts structure back in the trend direction, we join the trend.
  long:
    - h4_bull_ob_high < (h4_range_low + h4_range_high) / 2
    - within(low <= h4_bull_ob_high, 20)
    - close > h4_bull_ob_low
    - smc_choch_up
  short:
    - h4_bear_ob_low > (h4_range_low + h4_range_high) / 2
    - within(high >= h4_bear_ob_low, 20)
    - close < h4_bear_ob_high
    - smc_choch_down
  stop: {method: structure, long_level: "lowest(low,10)", short_level: "highest(high,10)", buffer_atr: 0.2, max_width_atr: 3.0}
  targets:
    long: ["2R", "max(3R, smc_liq_above)"]
    short: ["2R", "max(3R, smc_liq_below)"]
    split: [0.5, 0.5]
  time_stop_bars: 30
  cooldown_bars: 4
  confirm_5m: false
  control_twin: S6-OB-FVG-noSMC
  known_weaknesses: "Fails in ranges; order blocks are easy to over-use."
  changelog:
    - "1.0 (2026-09-24): first version (Phase 7). No 5m confirmation yet (Phase 10)."

- id: S6-OB-FVG-noSMC
  version: "1.0"
  status: FORMALIZED
