  source: "ICT material (CLAIM), AGENT_PROMPT.md section 9 S8"
  hypothesis: "A sweep of the prior-day low (high) that closes back inside the prior-day range reverses to the daily middle and then the opposite extreme."
  timeframes: ["1h", "30m"]
  description: "Price pokes below yesterday's low, then closes back inside yesterday's range: aim for the middle, then yesterday's high."
  logic: >-
    Many stops sit just beyond yesterday's high and low. When price runs them and closes back
    inside the range, the move beyond was a stop-hunt. TP1 = middle of yesterday's range,
    TP2 = the other end. No trade unless the middle is at least 1R away.
  long:
