# =====================================================================
#  STRATEGY LIBRARY - spec v3 (AGENT_PROMPT.md section 10)
#  Every FORMALIZED strategy is backtested automatically on every run, with fees.
#  None is assumed to work. Only APPROVED versions (your "yes") ever send [ENTRY] emails.
#
#  EACH STRATEGY IS AN "ID CARD":
#    id / version      name + version. A TESTED version never changes: to change the rules,
#                      copy the block, raise the version ("1.0" -> "1.1"), add a changelog line.
#                      (The engine refuses a tested version whose rules were edited.)
#    status            what YOU set: IDEA (written down, not tested) | FORMALIZED (test it) |
#                      RETIRED (archived, not tested). The engine sets BACKTESTING / VALIDATION /
#                      FAILED / PAPER_TRADING / RETIRED itself, once a day (reports/latest.md,
#                      memory/strategy_registry.csv). APPROVED only ever comes from you.
#    family            trend_following (A) | momentum (B) | breakout (C) | mean_reversion (D) |
#                      price_action (E) | mtf_pullback (F) | liquidity_reversal (G) | smc (H)
#    gate              trend          = needs 2 of 1D/4H/1H in its direction, no trade against a
#                                       STRONG weekly trend (weekly veto)
#                      reversal       = needs 2 of 1D/4H/1H in its direction, no weekly veto
#                      mean_reversion = only in its (range) regimes, never against a STRONG 1W/1D/4H trend
#    regimes           allowed market regimes; outside them the strategy stands down.
#                      Checked on 1D for 1D signals, 4H for 4H signals, 1H for 1H and below.
#    long / short      conditions - ALL must be true on a CLOSED candle. Entry = next candle's open.
#    exit_long/_short  (optional) ALL true -> close the trade early.
#    stop              {method: atr, atr: 1.5}  -> stop 1.5 ATR away
#                      {method: structure, long_level: <expression>, short_level: <expression>,
#                       buffer_atr: 0.2, max_width_atr: 3.0} -> stop beyond that level + 0.2 ATR;
#                       no trade when the stop would be wider than 3 ATR
#    targets           (optional; default = config.yaml trade_plan: TP 1R/2R/3R, close 40/30/30%)
#                      long / short: list of "2R", a column name, or "max(3R, column)" (the farther one)
#                      split: share closed at each target (adds up to 1)
#                      need: {long: column, short: column, min_r: 2.0} -> no trade unless that level
#                      is at least 2R away
#    time_stop_bars    close after this many candles; cooldown_bars = candles to wait after a trade
#    control_twin      the same idea WITHOUT its special (e.g. SMC) ingredient - it must be beaten
#    edge              WHY it should make money (hypothesis, not proof): who_pays (who is on the other side and why
#                      they lose), mechanism, fails_when, kill_rule. Not part of the rules (no new version needed);
#                      the engine shows the measured evidence next to it. Required on lab cards.
#    params            the numbers the rules use, by name: write {fast} in a rule and fast: 20 under params.
#                      The daily research run moves each one -20% and +20% (one at a time, plus the stop
#                      size and the time stop); a real edge must stay profitable (AGENT_PROMPT.md section 11).
#
#  BUILDING BLOCKS you can use inside rules:
#    open high low close volume        -> candle prices
#    ema(close,20) sma(close,50)        -> moving averages
#    rsi(close,14)  atr(14)  adx(14)    -> momentum / volatility / trend strength
#    macd_line(close) macd_signal(close) macd_hist(close)
#    bb_upper(close,20,2) bb_lower(close,20,2) bb_mid(close,20) bb_width(close,20,2)
#    highest(high,20) lowest(low,20)    -> highest high / lowest low of last N candles
#    prev(x) or shift(x,n)              -> value 1 or n candles ago
#    vol_sma(20)                        -> average volume
#    supertrend_dir(10,3)               -> +1 up-trend, -1 down-trend
#    pct_rank(x,100)                    -> 0..1, where x ranks vs last 100 values
#    cross_up(a,b) cross_down(a,b)      -> a crossed above / below b on this candle
#    within(x,n)                        -> x was true on this candle or one of the n-1 before
#    bars_since(x)                      -> candles since x was last true (0 = this candle)
#    htf_up / htf_down                  -> the HIGHER timeframe is trending up / down
#                                          (5m,15m -> 1h | 30m,1h -> 4h | 4h -> 1d)
#    feature engine columns             -> displacement_up, bull_engulf, rel_vol, ... (engine/features.py)
#    smc_* (this timeframe)             -> events: smc_sweep_bull/_bear, smc_bos_up/_down, smc_choch_up/_down,
#                                          smc_fvg_retrace_bull/_bear; context: smc_range_pos (<0.5 = discount),
#                                          smc_in_bull_ob / smc_in_bear_ob, smc_bull_ob_low/_high, smc_sweep_pdl /
#                                          smc_sweep_pdh, smc_sweep_bull_low / smc_sweep_bear_high, smc_liq_above /
#                                          smc_liq_below, smc_pdh / smc_pdl / smc_pd_mid, smc_kz_london /
#                                          smc_kz_ny_am / smc_kz_silver_bullet / smc_kz_asia / smc_in_killzone
#    h4_* (below 4H only)               -> the same SMC context from the newest CLOSED 4H candle,
#                                          e.g. h4_bull_ob_low, h4_bull_ob_high, h4_range_low, h4_range_high
# =====================================================================

- id: trend_pullback
  version: "1.0"
  status: FORMALIZED
  family: mtf_pullback
  gate: trend
  regimes: [STRONG_BULL, WEAK_BULL, STRONG_BEAR, WEAK_BEAR]
  source: "Existing library (before v3), re-versioned under spec v3"
  hypothesis: "In a trend confirmed by the higher timeframe, a pullback to the 20 EMA that closes strong again continues the trend."
  timeframes: ["4h", "1h", "30m", "15m"]
  description: "Buy the dip inside an up-trend: price pulls back to the 20 EMA and bounces."
  logic: >-
    Trends tend to continue. Instead of chasing a big green candle, we wait for price to
    come back to the 20 EMA (a 'value' area) while the higher timeframe is still trending,
    then enter when the candle closes strong again. RSI 40-65 means momentum reset but not weak.
  params: {fast: 20, slow: 50, rsi_n: 14, long_rsi_lo: 40, long_rsi_hi: 65, short_rsi_hi: 60, short_rsi_lo: 35}
  long:
    - htf_up
    - ema(close,{fast}) > ema(close,{slow})
    - low <= ema(close,{fast}) * 1.002
    - close > ema(close,{fast})
    - close > open
    - rsi(close,{rsi_n}) > {long_rsi_lo}
    - rsi(close,{rsi_n}) < {long_rsi_hi}
  short:
    - htf_down
    - ema(close,{fast}) < ema(close,{slow})
    - high >= ema(close,{fast}) * 0.998
    - close < ema(close,{fast})
    - close < open
    - rsi(close,{rsi_n}) < {short_rsi_hi}
    - rsi(close,{rsi_n}) > {short_rsi_lo}
  stop: {method: atr, atr: 1.5}
  time_stop_bars: 30
  cooldown_bars: 0
  known_weaknesses: "Fails in ranges (every touch of the EMA looks like a pullback); late in a trend the bounce is often the last one."
  edge:
    who_pays: "late buyers who sold the dip into a trend that the higher timeframe still supports"
    mechanism: "trends persist; a pullback to the 20 EMA resets momentum and new buyers step in at 'value'"
    fails_when: "ranges and the last leg of a mature trend (the bounce fails)"
    kill_rule: "retired by the engine's paper rules (last 20 paper signals below -0.10R or 8R drawdown), or FAILED when the unseen-data part of the backtest turns negative"
  changelog:
    - "1.0 (2026-09-24): re-versioned under spec v3. Rules, stop and hold time unchanged; new: allowed regimes + trend gate."

- id: donchian_breakout
  version: "1.0"
  status: FORMALIZED
  family: breakout
  gate: trend
  regimes: [STRONG_BULL, WEAK_BULL, STRONG_BEAR, WEAK_BEAR, EXPANSION, COMPRESSION]
  source: "Existing library (before v3), re-versioned under spec v3"
  hypothesis: "A close beyond the 20-candle range with 1.5x volume and ADX > 20 starts a move that is worth following."
  timeframes: ["4h", "1h", "30m"]
  description: "Turtle-style breakout: price closes above the highest high of the last 20 candles with strong volume."
  logic: >-
    Breakouts of a 20-candle range with 1.5x normal volume show new buyers stepping in.
    ADX > 20 confirms the market is trending, not chopping. This is the family of rules
    with the best published long-term evidence in crypto (trend following).
  params: {n: 20, vol_x: 1.5, adx_min: 20, exit_n: 10}
  long:
    - htf_up
    - close > prev(highest(high,{n}))
    - volume > vol_sma(20) * {vol_x}
    - adx(14) > {adx_min}
  short:
    - htf_down
    - close < prev(lowest(low,{n}))
    - volume > vol_sma(20) * {vol_x}
    - adx(14) > {adx_min}
  exit_long:
    - close < prev(lowest(low,{exit_n}))
  exit_short:
    - close > prev(highest(high,{exit_n}))
  stop: {method: atr, atr: 2.0}
  time_stop_bars: 60
  cooldown_bars: 0
  known_weaknesses: "Many false breakouts in chop; wide stops; most of the profit comes from a few big trends."
  edge:
    who_pays: "traders fading the breakout (short at the range top) whose stops then add fuel to the move"
    mechanism: "a close outside a 20-candle range with 1.5x volume marks new participation; trend-following has the longest published record of the idea families"
    fails_when: "choppy ranges and low volume: most breakouts fall back inside"
    kill_rule: "retired by the engine's paper rules (last 20 paper signals below -0.10R or 8R drawdown), or FAILED when the unseen-data part of the backtest turns negative"
  changelog:
    - "1.0 (2026-09-24): re-versioned under spec v3. Rules, stop and hold time unchanged; new: allowed regimes + trend gate."

- id: rsi2_dip_buy
  version: "1.0"
  status: FORMALIZED
  family: mean_reversion
  gate: mean_reversion
  regimes: [RANGE, HIGH_VOL_RANGE]
  source: "Existing library (before v3), re-versioned under spec v3"
  hypothesis: "A sharp 1-2 candle dip (RSI(2) < 10) snaps back towards the short-term average."
  timeframes: ["4h", "1h", "30m", "15m"]
  description: "Connors RSI(2): in a long-term up-trend, buy a sharp 1-2 candle dip, sell the bounce."
  logic: >-
    When price is above the 200 EMA (long-term up-trend) but RSI(2) drops under 10, the
    market is short-term oversold. Such dips often snap back within a few candles. We exit
    as soon as price closes back above the 5-period average.
  params: {trend_n: 200, rsi_n: 2, lo: 10, hi: 90, exit_n: 5}
  long:
    - close > ema(close,{trend_n})
    - rsi(close,{rsi_n}) < {lo}
  short:
    - close < ema(close,{trend_n})
    - rsi(close,{rsi_n}) > {hi}
  exit_long:
    - close > sma(close,{exit_n})
  exit_short:
    - close < sma(close,{exit_n})
  stop: {method: atr, atr: 2.0}
  time_stop_bars: 15
  cooldown_bars: 0
  known_weaknesses: "Catching a falling knife in a real breakdown; many small wins, rare large losses."
  edge:
    who_pays: "short-term sellers who panic-sell a two-day drop inside a range"
    mechanism: "extreme short-term oversold readings in a range tend to snap back toward the middle (mean reversion)"
    fails_when: "real breakdowns and strong down-trends (catching a falling knife)"
    kill_rule: "retired by the engine's paper rules (last 20 paper signals below -0.10R or 8R drawdown), or FAILED when the unseen-data part of the backtest turns negative"
  changelog:
    - "1.0 (2026-09-24): re-versioned under spec v3. Rules, stop and hold time unchanged; new: allowed regimes + mean_reversion gate."

- id: bb_squeeze_breakout
  version: "1.0"
  status: FORMALIZED
  family: breakout
  gate: trend
  regimes: [COMPRESSION, EXPANSION, STRONG_BULL, WEAK_BULL, STRONG_BEAR, WEAK_BEAR]
  source: "Existing library (before v3), re-versioned under spec v3"
  hypothesis: "After a volatility squeeze (bandwidth in its lowest 20%), a band break with volume in the higher-timeframe direction runs."
  timeframes: ["4h", "1h", "30m", "15m"]
  description: "Volatility squeeze: Bollinger Bands get very tight, then price breaks out with volume."
  logic: >-
    Quiet markets are followed by big moves. When the Bollinger Band width is in its lowest
    20% of the last 100 candles, energy is building. We join the breakout direction only when
    volume confirms and the higher timeframe agrees.
  params: {bb_n: 20, bb_k: 2, rank_n: 100, squeeze: 0.2, vol_x: 1.3}
  long:
    - pct_rank(prev(bb_width(close,{bb_n},{bb_k})),{rank_n}) < {squeeze}
    - close > bb_upper(close,{bb_n},{bb_k})
    - volume > vol_sma(20) * {vol_x}
    - htf_up
  short:
    - pct_rank(prev(bb_width(close,{bb_n},{bb_k})),{rank_n}) < {squeeze}
    - close < bb_lower(close,{bb_n},{bb_k})
    - volume > vol_sma(20) * {vol_x}
    - htf_down
  stop: {method: atr, atr: 1.5}
  time_stop_bars: 30
  cooldown_bars: 0
  known_weaknesses: "Squeezes can break both ways (head fakes); rare signals."
  edge:
    who_pays: "traders positioned for the quiet range to continue, stopped out when volatility expands"
    mechanism: "low volatility clusters and is followed by expansion; the first strong close outside the bands shows the direction"
    fails_when: "head fakes: the squeeze breaks one way, then reverses"
    kill_rule: "retired by the engine's paper rules (last 20 paper signals below -0.10R or 8R drawdown), or FAILED when the unseen-data part of the backtest turns negative"
  changelog:
    - "1.0 (2026-09-24): re-versioned under spec v3. Rules, stop and hold time unchanged; new: allowed regimes + trend gate."

- id: macd_trend_cross
  version: "1.0"
  status: FORMALIZED
  family: momentum
  gate: trend
  regimes: [STRONG_BULL, WEAK_BULL, STRONG_BEAR, WEAK_BEAR]
  source: "Existing library (before v3), re-versioned under spec v3"
  hypothesis: "A MACD cross below zero inside a 200-EMA trend marks the end of a pullback and momentum resuming."
  timeframes: ["4h", "1h", "30m"]
  description: "MACD crosses up below zero while price is above the 200 EMA (trend resumes after a pullback)."
  logic: >-
    A MACD cross below the zero line inside an up-trend means the pullback is ending and
    momentum is turning back in the trend direction. The 200 EMA and higher timeframe filter
    remove most counter-trend crosses, which are the ones that usually fail.
  params: {trend_n: 200}
  long:
    - close > ema(close,{trend_n})
    - htf_up
    - cross_up(macd_line(close), macd_signal(close))
    - macd_line(close) < 0
  short:
    - close < ema(close,{trend_n})
    - htf_down
    - cross_down(macd_line(close), macd_signal(close))
    - macd_line(close) > 0
  stop: {method: atr, atr: 1.5}
  time_stop_bars: 40
  cooldown_bars: 0
  known_weaknesses: "Lagging; in sideways markets the crosses whipsaw."
  edge:
    who_pays: "counter-trend traders still betting on the old direction when momentum turns"
    mechanism: "a MACD cross in the higher-timeframe direction marks momentum turning with the trend"
    fails_when: "sideways markets, where crosses whipsaw back and forth"
    kill_rule: "retired by the engine's paper rules (last 20 paper signals below -0.10R or 8R drawdown), or FAILED when the unseen-data part of the backtest turns negative"
  changelog:
    - "1.0 (2026-09-24): re-versioned under spec v3. Rules, stop and hold time unchanged; new: allowed regimes + trend gate."

- id: supertrend_flip
  version: "1.0"
  status: FORMALIZED
  family: trend_following
  gate: trend
  regimes: [STRONG_BULL, WEAK_BULL, STRONG_BEAR, WEAK_BEAR, EXPANSION]
  source: "Existing library (before v3), re-versioned under spec v3"
  hypothesis: "A Supertrend flip in the higher-timeframe direction with ADX > 20 catches a new leg of the trend."
  timeframes: ["4h", "1h", "30m"]
  description: "Supertrend(10,3) flips to up-trend while ADX shows a real trend."
  logic: >-
    Supertrend is an ATR-based trailing line. When it flips, the short-term trend has
    changed. We only take flips in the direction of the higher timeframe and when ADX > 20,
    and we exit when Supertrend flips back.
  params: {st_n: 10, st_k: 3, adx_min: 20}
  long:
    - supertrend_dir({st_n},{st_k}) == 1
    - prev(supertrend_dir({st_n},{st_k})) == -1
    - adx(14) > {adx_min}
    - htf_up
  short:
    - supertrend_dir({st_n},{st_k}) == -1
    - prev(supertrend_dir({st_n},{st_k})) == 1
    - adx(14) > {adx_min}
    - htf_down
  exit_long:
    - supertrend_dir({st_n},{st_k}) == -1
  exit_short:
    - supertrend_dir({st_n},{st_k}) == 1
  stop: {method: atr, atr: 2.0}
  time_stop_bars: 60
  cooldown_bars: 0
  known_weaknesses: "Flips late; gives back a lot before the exit flip."
  edge:
    who_pays: "traders holding the old trend who exit late, after the flip"
    mechanism: "an ATR-based trailing line flips only after a real move, so it catches the middle of trends"
    fails_when: "ranges (frequent false flips) and sharp V-reversals"
    kill_rule: "retired by the engine's paper rules (last 20 paper signals below -0.10R or 8R drawdown), or FAILED when the unseen-data part of the backtest turns negative"
  changelog:
    - "1.0 (2026-09-24): re-versioned under spec v3. Rules, stop and hold time unchanged; new: allowed regimes + trend gate."

- id: liquidity_sweep_reversal
  version: "1.0"
  status: FORMALIZED
  family: liquidity_reversal
  gate: reversal
  regimes: [RANGE, HIGH_VOL_RANGE, WEAK_BULL, WEAK_BEAR, STRONG_BULL, STRONG_BEAR, TRANSITION]
  source: "Existing library (before v3), re-versioned under spec v3"
  hypothesis: "A wick through the 20-candle low (high) that closes back inside, with volume, means the stop-hunt failed and price reverses."
  timeframes: ["1h", "30m", "15m", "5m"]
  description: "Stop-hunt reversal: price dips below the 20-candle low, then closes back above it."
  logic: >-
    Many traders keep stop-losses just under recent lows. Big players push price there to
    fill orders ('liquidity grab'), then price snaps back. A candle that breaks the low but
    CLOSES back above it, with above-average volume, shows the sellers failed.
  params: {n: 20, vol_x: 1.2, rsi_n: 14, long_rsi_max: 45, short_rsi_min: 55}
  long:
    - low < prev(lowest(low,{n}))
    - close > prev(lowest(low,{n}))
    - close > open
    - volume > vol_sma(20) * {vol_x}
    - rsi(close,{rsi_n}) < {long_rsi_max}
  short:
    - high > prev(highest(high,{n}))
    - close < prev(highest(high,{n}))
    - close < open
    - volume > vol_sma(20) * {vol_x}
    - rsi(close,{rsi_n}) > {short_rsi_min}
  stop: {method: atr, atr: 1.0}
  time_stop_bars: 20
  cooldown_bars: 0
  known_weaknesses: "Strong trends keep sweeping lows without reversing; low timeframes are expensive after fees."
  edge:
    who_pays: "breakout traders who bought the new low's stop run, and stop-losses taken below the obvious low"
    mechanism: "stops cluster below obvious lows; once they are taken and price closes back inside, the forced selling is over"
    fails_when: "strong trends that keep sweeping lows without reversing"
    kill_rule: "retired by the engine's paper rules (last 20 paper signals below -0.10R or 8R drawdown), or FAILED when the unseen-data part of the backtest turns negative"
  changelog:
    - "1.0 (2026-09-24): re-versioned under spec v3. Rules, stop and hold time unchanged; new: allowed regimes + reversal gate."

- id: ema_9_21_cross
  version: "1.0"
  status: FORMALIZED
  family: trend_following
  gate: trend
  regimes: [STRONG_BULL, WEAK_BULL, STRONG_BEAR, WEAK_BEAR, EXPANSION]
  source: "Existing library (before v3), re-versioned under spec v3"
  hypothesis: "A 9/21 EMA cross with the 200 EMA trend and ADX > 20 catches trend moves."
  timeframes: ["1h", "30m", "15m", "5m"]
  description: "Classic 9/21 EMA crossover, only with the 200 EMA trend and ADX filter."
  logic: >-
    The simplest trend-following signal (the one from our first lesson). On its own it
    gets whipsawed; the 200 EMA and ADX > 20 filters try to keep it only for trending markets.
    Kept here so you can SEE how it compares to the others.
  params: {fast: 9, slow: 21, trend_n: 200, adx_min: 20}
  long:
    - cross_up(ema(close,{fast}), ema(close,{slow}))
    - close > ema(close,{trend_n})
    - adx(14) > {adx_min}
  short:
    - cross_down(ema(close,{fast}), ema(close,{slow}))
    - close < ema(close,{trend_n})
    - adx(14) > {adx_min}
  exit_long:
    - cross_down(ema(close,{fast}), ema(close,{slow}))
  exit_short:
    - cross_up(ema(close,{fast}), ema(close,{slow}))
  stop: {method: atr, atr: 1.5}
  time_stop_bars: 40
  cooldown_bars: 0
  known_weaknesses: "Whipsaws a lot; kept mainly as a simple benchmark."
  edge:
    who_pays: "late momentum traders; this card is mainly a simple benchmark"
    mechanism: "a fast / slow EMA cross follows short-term momentum"
    fails_when: "sideways markets (whipsaw); the edge is expected to be small or absent"
    kill_rule: "retired by the engine's paper rules (last 20 paper signals below -0.10R or 8R drawdown), or FAILED when the unseen-data part of the backtest turns negative"
  changelog:
    - "1.0 (2026-09-24): re-versioned under spec v3. Rules, stop and hold time unchanged; new: allowed regimes + trend gate."

