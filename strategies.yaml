  description: "Graded C: must-haves (box within 2.0 x ATR under a level, strong breakout candle, not against a 1H trend, retest rejection) + at least 2 of 5 bonus points (tight compression, volume spike, CVD holding, London / NY, the playbook's regime rule)."
  logic: >-
    pbCg_long: must-haves = the 8 x 15m box within 2.0 x ATR(15m) with a marked level within 0.5 x ATR above it,
    a 5m close >= 0.2 x ATR beyond the level with a body >= 60%, a 1H trend up or a range / transition, then
    within 12 candles a bullish rejection candle in the level zone before a close back inside by > 0.3 ATR.
    Bonus points: the playbook's compression (ATR < 0.8 x average and the box within 1.2 x ATR), the breakout's
    volume spike, the CVD above its low since the breakout, London / NY session, the playbook's regime rule
    (trend in the direction, or range / transition near a session open). >= 2 points = signal, < 3 = half size.
    Entry: limit at the signal close (2 candles); stop / TP2 / invalidation as PB-C-BREAKOUT; fee cap 0.25R.
  long: ["pbCg_long == 1", "pb_funding_ok_long == 1", "pb_btc_ok_long == 1"]
  short: ["pbCg_short == 1", "pb_funding_ok_short == 1", "pb_btc_ok_short == 1"]
  half_size: {long: pbCg_half_long, short: pbCg_half_short, why: "grade B setup (2 of 5 bonus points)"}
  entry: {type: limit, offset_atr: 0, valid_bars: 2}
  stop: {method: structure, long_level: pbCg_stop_long, short_level: pbCg_stop_short, buffer_atr: 0, min_width_atr: 0.5, max_width_atr: 3.0, max_cost_r: 0.25}
  targets:
    long: ["1R", pbCg_tp2_long]
    short: ["1R", pbCg_tp2_short]
    split: [0.5, 0.5]
    min_rr_after_fees: 1.5
  manage:
    be_plus_fees: true
    trail: {swing_n: 3, ema: 9}
    progress: {r: 0.5, bars: 6}
    invalidate: {long: pbCg_inval_long, short: pbCg_inval_short}
  time_stop_bars: 48
  cooldown_bars: 3
  known_weaknesses: "Still rare: strong breakouts right out of a quiet box with a clean retest (BTC 2026: about 1 a month); the grading thresholds are a choice."
  edge:
    type: structural
    works_in: [STRONG_BULL, WEAK_BULL, STRONG_BEAR, WEAK_BEAR, EXPANSION, COMPRESSION, RANGE, TRANSITION]
    who_pays: "traders short under a level during compression, whose stops fuel the breakout, and late sellers on the retest"
    mechanism: "a quiet period, a strong break and a held retest show the other side is gone; each bonus makes it more likely"
    fails_when: "false breakouts; and if the bonus conditions were what carried the edge (then -APLUS beats it)"
    kill_rule: "FAILED by the research when the unseen-data part of the backtest turns negative, or when it does worse than PB-C-APLUS"
  changelog:
    - "1.0 (2026-10-06): graded Strategy C (operator's request: rules that adapt instead of all-or-nothing), with the fee fix."

