# Source: docs/playbook/Crypto_Scalping_Playbook.txt; rule-by-rule map: docs/PLAYBOOK.md; the building
# blocks pb_* / pbA_* / pbB_* / pbC_* are computed on closed 5m candles by engine/scalp_playbook.py with the
# playbook's own definitions and numbers. gate: playbook = the 1H regime and bias are the playbook's own
# (in the rules below), not the engine's. Every card is tested twice: with CVD (the operator chose real
# aggressive volume) and without it (control twin) - CVD is kept only if it helps.
# time_stop_bars 48 (4 hours) is the engine's required outer limit; the playbook's own time stop is the
