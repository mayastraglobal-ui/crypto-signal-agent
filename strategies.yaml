    short: [smc_pd_mid, smc_pdl]
    split: [0.5, 0.5]
    need: {long: smc_pd_mid, short: smc_pd_mid, min_r: 1.0}
  time_stop_bars: 30
  cooldown_bars: 4
  confirm_5m: false
  control_twin: S8-PDH-PDL-SWEEP-noSMC
